name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore server/StandChillow.LanServer.csproj

      - name: Build server
        run: dotnet build server/StandChillow.LanServer.csproj -c Release --no-restore

      - name: Build Telegram plugin
        run: dotnet build server/plugins-src/StandChillow.Plugin.Telegram/StandChillow.Plugin.Telegram.csproj -c Release

      - name: Test protocol invariants
        shell: bash
        run: >-
          set -o pipefail; dotnet test tests/StandChillow.LanServer.Tests/StandChillow.LanServer.Tests.csproj
          -c Release --results-directory "${{ runner.temp }}/test-results"
          --logger "trx;LogFileName=protocol-tests.trx"
          2>&1 | tee "${{ runner.temp }}/test-output.txt"

      - name: Annotate failed protocol assertions
        if: failure()
        shell: bash
        run: |
          grep -A 12 -E 'Error Message:|Failed StandChillow' "${{ runner.temp }}/test-output.txt" \
            | head -60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload failed test report (${{ matrix.rid }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-protocol-tests-${{ matrix.rid }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: error
          retention-days: 3

      - name: Publish self-contained server (${{ matrix.rid }})
        run: >-
          dotnet publish server/StandChillow.LanServer.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          -o ${{ runner.temp }}/standchillow-publish

      # PR runs upload too (shorter retention): lets a branch build be tested on a
      # real desktop/handset before merge without pushing to main.
      - name: Upload runnable server (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: standchillow-server-${{ matrix.rid }}
          path: ${{ runner.temp }}/standchillow-publish
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}

  release:
    name: GitHub Release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes needs a git repo to find the previous tag
      # ("fatal: not a git repository (or any of the parent directories): .git"),
      # so check out the tagged commit before touching the release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One subdirectory per artifact (all three builds share the same file names,
      # so they must NOT be merged into one directory).
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Package and publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in release/standchillow-server-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -q -r "../../out/${name}.zip" .)
          done
          ls -l out
          tag="$GITHUB_REF_NAME"
          # A release created by hand in the UI (pre-release flow) already owns the tag;
          # upload into it instead of failing with 422 already_exists.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — uploading assets"
            gh release upload "$tag" out/*.zip --clobber
          else
            # Tags starting with 'v' published from CI are pre-releases until promoted.
            gh release create "$tag" out/*.zip \
              --title "влалChillow Server $tag" \
              --prerelease \
              --generate-notes
          fi

  format:
    name: format (advisory)
    runs-on: ubuntu-latest
    # Advisory until the tree is fully formatted. Set continue-on-error to false
    # once `dotnet format` reports a clean run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check formatting
        run: dotnet format server/StandChillow.LanServer.csproj --verify-no-changes --severity warn

  hygiene:
    name: hygiene guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reverse-engineering dumps, game binaries and runtime captures must never
      # enter the published tree.
      - name: Reject RE dumps and game binaries
        run: |
          bad=$(git ls-files | grep -E '^(decompiled|original)/|\.(apk|aab|so|unity3d|dat)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must stay local (see .gitignore):"
            echo "$bad"
            exit 1
          fi

      - name: Reject committed captures and logs
        run: |
          bad=$(git ls-files | grep -E '(^|/)(captures|logs)/|\.log$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Runtime captures and logs are evidence-only, do not commit:"
            echo "$bad"
            exit 1
          fi
